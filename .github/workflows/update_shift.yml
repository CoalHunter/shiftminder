name: Update Jadwal Shift

on:
  schedule:
    - cron: '0 17 * * *'   # Setiap hari 17:00 UTC = 00:00 WIB
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Generate index.html
        run: python cek_shift.py

      - name: Commit & Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html data.json
          git diff --staged --quiet || git commit -m "Daily update: $(TZ=Asia/Jakarta date '+%d-%m-%Y %H:%M WIB')"
          git push
